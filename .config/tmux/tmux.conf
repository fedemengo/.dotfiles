
set-environment -g SSH_AUTH_SOCK $HOME/.ssh/agent.sock

# plugins
# Keep tmux-resurrect and tmux-continuum after theme/status plugins.
# tmux-continuum relies on status-right and can break if a later plugin overwrites it.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'fedemengo/tmux-minova'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fedemengo/tmmx'
set -g @tmmx_host_colors 'fedora=#ff9e64,chonk=#ff4500,beef=#ff4500,harlie=#00ff00,turing=#ffdf00'
set -g @tmmx_manager_picker_key 'f'
set -g @tmmx_manager_local_sessions 'host'
set -g @tmmx_popup_width '30%'
set -g @tmmx_popup_height '30%'
set -g @resurrect-dir '~/.local/share/tmux/resurrect'

set -g @minova-segment-mode-fg "#ff6526"
set -g @minova-pane "#I#{?pane_in_mode,#{pane_mode},}.#W"
set -g @minova-segment-hostname "@#h"
set -g @minova-segment-hostname-fg "#ff55ff"
set -g @minova-segment-session-fg "#50fa7b"
set -g @minova-segments-left "mode"
set -g @minova-segments-right "session hostname"
set -g @minova-fg "#7f7f7f"
set -g @minova-fg-current "#ffffff"
set -g @minova-hline "true"
set -g @minova-hline-fg "#222222"
set -g @minova-pane-border-fg "#222222"
set -g @minova-pane-active-border-fg "#999999"


set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color*:Tc"
# Export tmux copies through OSC52. The screen capability is needed by an
# inner tmux, whose terminal is the outer tmux rather than Alacritty itself.
set -s set-clipboard on
set -as terminal-features ',alacritty:clipboard,screen*:clipboard'

bind r source-file ~/.config/tmux/tmux.conf; display "Reloaded!"

bind C-h run-shell ~/.tmux/bin/cht.sh

unbind C-b

# Ctrl-\\ is this configuration's preferred tmux prefix; tmmx adds the
# context-aware routing for local and SSH-backed sessions.
set -g prefix None
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g pane-border-status off

set -g history-limit 500000

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 20
bind -r J resize-pane -D 8
bind -r K resize-pane -U 8
bind -r L resize-pane -R 20

bind b last-window
bind Tab last-window
bind c new-window -a -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind -r n next-window
bind -r p previous-window

bind q swap-window -t -1\; select-window -t -1
bind Q swap-window -t +1\; select-window -t +1
bind e swap-window -s : -t -1

# prefix + C + n
bind C switch-client -T naming
bind -T naming n command-prompt -I "#W" "rename-window '%%'"

bind 0 select-window -t 10

# prefix + Space + 0-9

set -g focus-events on
set -sg escape-time 10

set -g status-interval 5
set -g automatic-rename on
set -g automatic-rename-format '#{pane_current_command} #{b:pane_current_path}'

set -g @continuum-restore 'on'

# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
run '~/.tmux/plugins/tpm/tpm'
