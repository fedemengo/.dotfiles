# editing this file triggers an immediate dependabot check on push
version: 2
updates:
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: daily
    # opt out of the default 3-day cooldown; bump to latest nvim right away
    cooldown:
      default-days: 0
    allow:
      - dependency-name: ".config/nvim"
    commit-message:
      prefix: "nvim"
    labels:
      - submodule
